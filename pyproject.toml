[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "minimal-linop"
version = "0.1.0"
description = "Linear operators with exact adjoints in PyTorch, composable with @, +, * and .H."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jonathan Dong", email = "jonathan.dong@epfl.ch" }]
keywords = ["linear-operator", "adjoint", "inverse-problems", "computational-imaging", "pytorch"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
]
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
fft = ["minimal-zoom-fft"]
test = ["pytest"]
notebooks = ["numpy", "scipy", "matplotlib", "jupyter"]

[project.urls]
Repository = "https://github.com/jon-dong/minimal-linop"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
